<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ivet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1CC8C8 0%, #0E9AA7 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      color: #0B3D45;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .emoji { font-size: 56px; }
    h1 { margin: 12px 0 8px; font-size: 28px; }
    p { color: #444; line-height: 1.5; margin-bottom: 24px; }
    a {
      display: block;
      background: #1CC8C8;
      color: #06323A;
      text-decoration: none;
      font-weight: 600;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    a:hover { opacity: 0.9; }
    .email-text { display: block; font-size: 14px; color: #0E7C86; margin: -4px 0 12px; word-break: break-all; }
    footer { margin-top: 20px; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🩺</div>
    <h1>Ivet</h1>
    <p>I care about innovation in healthcare.</p>
    <a href="https://www.linkedin.com/in/ivetavalos/" target="_blank">LinkedIn</a>
    <a href="mailto:ivetavalos12@gmail.com">Email me</a>
    <span class="email-text">ivetavalos12@gmail.com</span>
    <footer>Built with AI in Build with AI · Startup UCLA</footer>
  </div>
</body>
</html>
